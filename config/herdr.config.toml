# Herdr config de Pablo — AgentNav E0 (2026-10-28)
# Referencia de cada clave: herdr --default-config
# Backup previo: config.toml.bak-2026-10-28

onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[terminal]
# Paneles con PowerShell 7 en vez de Windows PowerShell 5.1
default_shell = "pwsh"
# 30/10: un espacio/pestaña/panel nuevo arranca en C:\ (donde viven los proyectos), no en la carpeta del panel actual ("follow").
new_cwd = "C:\\"

[keys]
# 28/10: con teclado en español, "?" después del prefijo no se reconoce (las letras sí).
# La ayuda va en F1. Si ctrl+b molesta porque Claude Code lo usa para mandar tareas a segundo plano, cambiar a prefix = "f12".
prefix = "ctrl+b"
help = "prefix+f1"
# 30/10: ctrl+b c = pestaña de AgentNav: un shell en la misma carpeta que el panel actual. 4/11: ya no arranca
# otro Claude ahí (eso queda en `agentnav tab agent`, sin tecla). El "+" de la barra hace lo mismo vía el plugin
# C:\AgentNav\plugin (gancho tab.created → agentnav adopt). La pestaña pelada (shell en new_cwd) queda en ctrl+b shift+c,
# con etiqueta "shell" para que el plugin no la adopte (adopta sólo las de etiqueta numérica); la tecla nativa de Herdr se desata.
new_tab = ""

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "py -I C:/AgentNav/agentnav.py tab shell"

[[keys.command]]
key = "prefix+c"
type = "shell"
command = "py -I C:\\AgentNav\\agentnav.py tab"

# AgentNav E2: selector de proyectos como popup de Herdr (ctrl+b, soltar, alt+p)
[[keys.command]]
key = "prefix+alt+p"
type = "popup"
command = "py -I C:\\AgentNav\\agentnav.py pick"
width = "70%"
height = "60%"

# 30/10: selector de temas (las paletas de config\\themes.json y los temas de Herdr). Enter aplica y recarga al instante.
[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "py -I C:/AgentNav/agentnav.py theme pick"
width = "60%"
height = "60%"

[ui]
# Lista de agentes como cola de atención: bloqueados primero
agent_panel_sort = "priority"
# Glifos distintos por estado, no sólo puntos de color
status_indicators = "symbols"
# ctrl+b c abre la pestaña sin preguntar nombre
prompt_new_tab_name = false
# Título de la pestaña de Windows Terminal
window_title = "{workspace} · {pane}"
# Cursor del panel. "auto" (= "drawn" en Windows): Herdr pinta su propio cuadrito como celda y esconde el cursor
# de Windows Terminal, para que ConPTY no lo haga parpadear mientras se escribe el frame. "native": el cursor de
# Windows Terminal (parpadea, se mueve en el mismo frame). Ninguno de los dos cambia cuánto tarda el cursor en
# seguir al tipeo: eso lo decide una retención de 20/100 ms del servidor, sólo en Windows (herdr-fork\cursor-lag.md).
# Cambiarlo recarga el cliente en caliente (herdr server reload-config), sin cerrar sesiones.
# host_cursor = "auto"

[ui.sidebar.agents]
# Claude: segunda línea = el título que Claude escribe (resumen de lo que hace)
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.toast]
# Notificación de Windows cuando un agente en otro espacio se bloquea o termina
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[advanced]
# 13/11: en Windows, Herdr retiene la posición del cursor antes de mostrarla (20 ms por paso, 100 ms por "salto")
# para evitar un parpadeo de ConPTY; PSReadLine redibuja la línea en cada tecla, así que cada tecla cuenta como salto
# y el cursor va atrás de lo que escribís (herdr-fork/cursor-lag.md). El build del fork (parche cursor-settle, desde
# el agentnav-v0.9.5 del 13/11) hace configurables las dos ventanas; 0/40 deja Windows como macOS/Linux. El Herdr
# oficial ignora estas claves. Se leen al arrancar el servidor (herdr server stop + agentnav up), no con reload-config.
cursor_settle_ms = 0
cursor_jump_hold_ms = 40
