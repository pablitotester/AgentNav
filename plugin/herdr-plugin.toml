# Plugin local de AgentNav para Herdr (30/10). Enlazado con: herdr plugin link C:\AgentNav\plugin
# Cada pestaña nueva pasa por `agentnav adopt`. Las que nacen con la etiqueta numérica de Herdr ("2", "3"…),
# que son las del "+" de la barra, se llevan a la carpeta del proyecto y arrancan el mismo agente, igual que
# ctrl+b c. Las que ya traen nombre (las de agentnav tab/open: el agente, o "shell") se dejan como están.
id = "agentnav"
name = "AgentNav"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "El + de la barra abre la pestaña en la carpeta del proyecto y con su agente"
platforms = ["windows"]

[[events]]
on = "tab.created"
command = ["py", "-I", "C:/AgentNav/agentnav.py", "adopt"]
